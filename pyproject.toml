[project]
name = "palace-nemotron"
version = "0.0.1"
description = "A private, always-on personal AI with a real long-term memory, running on NVIDIA Nemotron via Nebius Token Factory."
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Jeffrey Pine Hein" }]
requires-python = ">=3.11"
